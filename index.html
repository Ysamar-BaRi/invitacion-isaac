<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invitación Dulce</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap');

  :root{
    --bg:#0b0807;
    --bg-2:#150f0e;
    --surface:#1b1211;
    --surface-2:#241715;
    --hairline:#3a2320;
    --red:#c81d34;
    --red-deep:#7f0f22;
    --red-glow:#e2405420;
    --text:#f4e9e0;
    --muted:#a68d84;
    --muted-2:#7c655d;
  }

  *{box-sizing:border-box;}
  html, body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(120% 90% at 50% -10%, var(--red-glow), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Manrope', ui-sans-serif, system-ui, sans-serif;
    height:100dvh;
    padding:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  h1,h2,h3,.display{
    font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    text-wrap:balance;
  }

  .stage{
    width:100%;
    max-width:560px;
    max-height:100%;
  }

  .card{
    position:relative;
    overflow-y:auto;
    max-height:calc(100dvh - 40px);
    background:linear-gradient(180deg, var(--surface), var(--bg-2));
    border:1px solid var(--hairline);
    border-radius:6px;
    padding:32px 30px;
    box-shadow:0 30px 80px -30px rgba(0,0,0,0.7), 0 0 0 1px rgba(200,29,52,0.05) inset;
  }

  #step-0{
    min-height:280px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  .card::before{
    content:"";
    position:absolute;
    inset:8px;
    border:1px solid rgba(200,29,52,0.22);
    border-radius:3px;
    pointer-events:none;
  }

  @media (max-width:480px){
    body{padding:12px;}
    .card{padding:22px 16px; max-height:calc(100dvh - 24px);}
    .card::before{inset:6px;}
    #step-0{min-height:240px;}
    .row-nav .btn-back{padding:16px 14px;}
    .btn-decoy{padding:12px 20px; font-size:13px;}
  }

  .progress{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:28px;
  }
  .progress .dot{
    width:26px;height:3px;border-radius:2px;
    background:var(--hairline);
    transition:background .25s ease;
  }
  .progress .dot.done{background:var(--red-deep);}
  .progress .dot.active{background:var(--red);}

  .eyebrow{
    text-align:center;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--muted-2);
    margin:0 0 10px;
  }

  .headline{
    text-align:center;
    font-size:clamp(30px,7vw,42px);
    font-weight:600;
    line-height:1.12;
    margin:0 0 6px;
    color:var(--text);
  }
  .headline em{color:var(--red);font-style:italic;}

  .sub{
    text-align:center;
    color:var(--muted);
    font-size:15px;
    line-height:1.55;
    margin:0 auto 30px;
    max-width:38ch;
  }

  .cover-mark{
    width:64px;height:64px;margin:0 auto 22px;
    border:1px solid var(--red-deep);
    border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;
    color:var(--red);
  }
  .cover-mark .cm-emoji{font-size:20px;line-height:1;}
  .cover-mark .cm-label{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:13px;
    line-height:1;
  }

  .cover-actions{
    margin-top:8px;
  }
  .cover-actions .btn-primary{
    position:relative;
    z-index:2;
  }
  .btn-decoy{
    position:absolute;
    appearance:none;
    border:1px solid var(--hairline);
    background:var(--surface-2);
    color:var(--muted);
    font-family:'Manrope', sans-serif;
    font-size:14px;
    font-weight:600;
    padding:14px 26px;
    border-radius:4px;
    cursor:pointer;
    transition:left .15s ease, top .15s ease;
    z-index:1;
  }

  label.field-label{
    display:block;
    font-size:12px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted-2);
    margin-bottom:12px;
  }

  textarea, .text-input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--hairline);
    border-radius:4px;
    color:var(--text);
    font-family:'Manrope', sans-serif;
    font-size:15px;
    padding:14px;
  }
  textarea{min-height:70px; resize:vertical;}
  textarea::placeholder, .text-input::placeholder{color:var(--muted-2);}
  textarea:focus, .text-input:focus, .chip:focus-visible, .btn:focus-visible, .day:focus-visible, .time-pill:focus-visible{
    outline:2px solid var(--red);
    outline-offset:2px;
  }

  .chip-group{margin-bottom:14px;}
  .chip-group .field-label{margin-bottom:8px;}
  .chip-grid{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .chip{
    appearance:none;
    border:1px solid var(--hairline);
    background:var(--surface-2);
    color:var(--text);
    font-family:'Manrope', sans-serif;
    font-size:14px;
    padding:10px 16px;
    border-radius:999px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, color .15s ease;
  }
  .chip:hover{border-color:var(--red-deep);}
  .chip.selected{
    background:var(--red);
    border-color:var(--red);
    color:#fff2ee;
  }

  .btn{
    appearance:none;
    width:100%;
    border:none;
    border-radius:4px;
    padding:16px;
    font-family:'Manrope', sans-serif;
    font-size:15px;
    font-weight:700;
    letter-spacing:.02em;
    cursor:pointer;
    transition:transform .12s ease, background .15s ease;
  }
  .btn-primary{
    background:var(--red);
    color:#1a0507;
  }
  .btn-primary:hover:not(:disabled){background:#d92e46;}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-primary:active:not(:disabled){transform:scale(.99);}

  .btn-ghost{
    background:transparent;
    color:var(--muted);
    border:1px solid var(--hairline);
    margin-top:10px;
  }
  .btn-ghost:hover{color:var(--text);border-color:var(--red-deep);}

  .row-nav{
    display:flex;
    gap:10px;
    margin-top:16px;
  }
  .row-nav .btn-back{
    flex:0 0 auto;
    width:auto;
    background:transparent;
    border:1px solid var(--hairline);
    color:var(--muted);
    padding:16px 18px;
  }
  .row-nav .btn-back:hover{color:var(--text);border-color:var(--red-deep);}
  .row-nav .btn-primary{flex:1;}

  .cal-head{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:10px 12px;
    margin-bottom:14px;
  }
  select.month-select{
    appearance:none;
    background:var(--surface-2);
    border:1px solid var(--hairline);
    color:var(--text);
    font-family:'Manrope', sans-serif;
    font-size:14px;
    font-weight:600;
    padding:10px 14px;
    border-radius:4px;
    cursor:pointer;
    max-width:100%;
  }

  .cal{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    max-width:320px;
    margin:0 auto;
  }
  .cal .dow{
    text-align:center;
    font-size:10.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted-2);
    padding-bottom:4px;
  }
  .day{
    appearance:none;
    aspect-ratio:1;
    border:1px solid var(--hairline);
    background:var(--surface-2);
    color:var(--text);
    border-radius:4px;
    font-family:'Manrope', sans-serif;
    font-size:14px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .day:hover{border-color:var(--red-deep);}
  .day.selected{background:var(--red);border-color:var(--red);color:#fff2ee;}
  .day.empty{visibility:hidden;}
  .day:disabled{opacity:.25;cursor:not-allowed;}
  .day:disabled:hover{border-color:var(--hairline);}

  .time-grid{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:12px;
  }
  .time-pill{
    appearance:none;
    border:1px solid var(--hairline);
    background:var(--surface-2);
    color:var(--text);
    padding:10px 14px;
    border-radius:6px;
    font-family:'Manrope', sans-serif;
    font-size:13.5px;
    font-variant-numeric:tabular-nums;
    cursor:pointer;
  }
  .time-pill:hover{border-color:var(--red-deep);}
  .time-pill.selected{background:var(--red);border-color:var(--red);color:#fff2ee;}

  .section-gap{margin-bottom:16px;}

  .summary-list{
    display:flex;
    flex-direction:column;
    gap:0;
    margin-bottom:28px;
    border-top:1px solid var(--hairline);
  }
  .summary-row{
    display:flex;
    justify-content:space-between;
    gap:18px;
    padding:16px 0;
    border-bottom:1px solid var(--hairline);
  }
  .summary-row .k{
    font-size:11.5px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--muted-2);
    flex:0 0 auto;
    padding-top:2px;
  }
  .summary-row .v{
    text-align:right;
    color:var(--text);
    font-size:14.5px;
    line-height:1.5;
    max-width:62%;
  }

  .signoff{
    text-align:center;
    margin-top:6px;
  }
  .signoff .line{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:clamp(26px,6vw,32px);
    color:var(--red);
    margin:0;
  }

  [hidden]{display:none!important;}

  @media (prefers-reduced-motion: reduce){
    .btn{transition:none;}
    .btn-decoy{transition:none;}
  }
</style>
</head>
<body>

<div class="stage">
  <div class="card">

    <div class="progress" id="progress" hidden>
      <div class="dot" data-i="1"></div>
      <div class="dot" data-i="2"></div>
      <div class="dot" data-i="3"></div>
      <div class="dot" data-i="4"></div>
    </div>

    <section id="step-0">
      <div class="cover-mark">
        <span class="cm-emoji">🏍️</span>
        <span class="cm-label">Ysa</span>
      </div>
      <h1 class="headline">Isaac, <em>¿te animas a salir?</em></h1>
      <div class="cover-actions">
        <button class="btn btn-primary" id="btn-start">Sí, quiero</button>
        <button class="btn-decoy" id="btn-decoy">No</button>
      </div>
    </section>

    <section id="step-1" hidden>
      <p class="eyebrow">Pregunta 1 de 4</p>
      <h2 class="headline" style="font-size:clamp(24px,6vw,30px)">Cuéntame algo tuyo</h2>
      <label class="field-label" for="freeform">Entrada libre</label>
      <textarea id="freeform" placeholder="Escribe aquí..."></textarea>
      <div class="row-nav">
        <button class="btn btn-back" data-back>Atrás</button>
        <button class="btn btn-primary" data-next="1">Siguiente</button>
      </div>
    </section>

    <section id="step-2" hidden>
      <p class="eyebrow">Pregunta 2 de 4</p>
      <h2 class="headline" style="font-size:clamp(24px,6vw,30px)">¿Qué se te antoja?</h2>

      <div class="chip-group">
        <label class="field-label">Dulces</label>
        <div class="chip-grid" id="chips-dulces">
          <button class="chip" data-value="🍮 Suspiro a la limeña">🍮 Suspiro a la limeña</button>
          <button class="chip" data-value="🍩 Picarones">🍩 Picarones</button>
          <button class="chip" data-value="🍇 Mazamorra morada">🍇 Mazamorra morada</button>
          <button class="chip" data-value="🍰 Tres leches">🍰 Tres leches</button>
          <button class="chip" data-value="🍪 Alfajores">🍪 Alfajores</button>
          <button class="chip" data-value="🧀 Cheesecake">🧀 Cheesecake</button>
          <button class="chip" data-value="🍫 Brownie con helado">🍫 Brownie con helado</button>
          <button class="chip" data-value="🍮 Tiramisú">🍮 Tiramisú</button>
          <button class="chip" data-value="🍦 Helado">🍦 Helado</button>
          <button class="chip" data-value="🍓 Fresas con crema">🍓 Fresas con crema</button>
          <button class="chip" data-value="🥮 Turrón">🥮 Turrón</button>
          <button class="chip" data-value="🍬 Chocolate">🍬 Chocolate</button>
        </div>
      </div>

      <div class="chip-group">
        <label class="field-label">Salados</label>
        <div class="chip-grid" id="chips-salados">
          <button class="chip" data-value="🧀 Tabla de quesos">🧀 Tabla de quesos</button>
          <button class="chip" data-value="🥟 Empanadas">🥟 Empanadas</button>
          <button class="chip" data-value="🍕 Piqueos">🍕 Piqueos</button>
          <button class="chip" data-value="🍟 Papas fritas">🍟 Papas fritas</button>
          <button class="chip" data-value="🫓 Tequeños">🫓 Tequeños</button>
          <button class="chip" data-value="🌮 Tacos">🌮 Tacos</button>
          <button class="chip" data-value="🥨 Pretzels">🥨 Pretzels</button>
          <button class="chip" data-value="🍢 Anticuchos">🍢 Anticuchos</button>
        </div>
      </div>

      <label class="field-label" for="otro-comida">Otro</label>
      <input class="text-input" id="otro-comida" type="text" placeholder="Escribe aquí...">

      <div class="row-nav">
        <button class="btn btn-back" data-back>Atrás</button>
        <button class="btn btn-primary" data-next="2" id="next-2" disabled>Siguiente</button>
      </div>
    </section>

    <section id="step-3" hidden>
      <p class="eyebrow">Pregunta 3 de 4</p>
      <h2 class="headline" style="font-size:clamp(24px,6vw,30px)">¿Y de película?</h2>
      <label class="field-label">Tipos de película</label>
      <div class="chip-grid" id="chips-pelis" style="margin-bottom:22px">
        <button class="chip" data-value="😂 Comedia">😂 Comedia</button>
        <button class="chip" data-value="👻 Terror">👻 Terror</button>
        <button class="chip" data-value="❤️ Romance">❤️ Romance</button>
        <button class="chip" data-value="💥 Acción">💥 Acción</button>
        <button class="chip" data-value="🎭 Drama">🎭 Drama</button>
        <button class="chip" data-value="🧸 Animación">🧸 Animación</button>
        <button class="chip" data-value="🚀 Ciencia ficción">🚀 Ciencia ficción</button>
        <button class="chip" data-value="🎥 Documental">🎥 Documental</button>
      </div>

      <label class="field-label" for="otro-peli">Otro</label>
      <input class="text-input" id="otro-peli" type="text" placeholder="Escribe aquí...">

      <div class="row-nav">
        <button class="btn btn-back" data-back>Atrás</button>
        <button class="btn btn-primary" data-next="3">Siguiente</button>
      </div>
    </section>

    <section id="step-4" hidden>
      <p class="eyebrow">Pregunta 4 de 4</p>
      <h2 class="headline" style="font-size:clamp(24px,6vw,30px)">Elige el día y la hora</h2>

      <div class="section-gap">
        <div class="cal-head">
          <label class="field-label" style="margin:0">Día</label>
          <select class="month-select" id="month-select"></select>
        </div>
        <div class="cal" id="cal-dow"></div>
        <div class="cal" id="cal-days"></div>
      </div>

      <div class="section-gap">
        <label class="field-label">Hora</label>
        <div class="time-grid" id="time-grid">
          <button class="time-pill" data-value="1:00 pm">1:00 pm</button>
          <button class="time-pill" data-value="4:00 pm">4:00 pm</button>
          <button class="time-pill" data-value="6:30 pm">6:30 pm</button>
          <button class="time-pill" data-value="8:00 pm">8:00 pm</button>
          <button class="time-pill" data-value="9:30 pm">9:30 pm</button>
        </div>
        <input class="text-input" id="time-custom" type="text" placeholder="O escribe la hora">
      </div>

      <div class="row-nav">
        <button class="btn btn-back" data-back>Atrás</button>
        <button class="btn btn-primary" data-next="4" id="next-4" disabled>Confirmar</button>
      </div>
    </section>

    <section id="step-5" hidden>
      <p class="eyebrow">Todo listo</p>
      <h2 class="headline" style="font-size:clamp(26px,6vw,32px)">Así quedamos</h2>

      <div class="summary-list">
        <div class="summary-row"><div class="k">Fecha</div><div class="v" id="sum-date">—</div></div>
        <div class="summary-row"><div class="k">Hora</div><div class="v" id="sum-time">—</div></div>
        <div class="summary-row"><div class="k">Comida</div><div class="v" id="sum-comida">—</div></div>
        <div class="summary-row"><div class="k">Películas</div><div class="v" id="sum-pelis">—</div></div>
        <div class="summary-row"><div class="k">De ti</div><div class="v" id="sum-free">—</div></div>
      </div>

      <div class="signoff">
        <p class="line">Ahí nos vemos, chico cabra.</p>
      </div>

      <button class="btn btn-ghost" id="btn-restart">Volver a empezar</button>
    </section>

  </div>
</div>

<script>
(function(){
  var state = {
    free: '',
    comida: new Set(),
    pelis: new Set(),
    otroComida: '',
    otroPeli: '',
    date: null,
    time: null
  };

  var sections = [0,1,2,3,4,5].map(function(i){ return document.getElementById('step-'+i); });
  var progress = document.getElementById('progress');
  var dots = progress.querySelectorAll('.dot');

  function show(i){
    sections.forEach(function(s,idx){ s.hidden = idx !== i; });
    progress.hidden = (i === 0 || i === 5);
    dots.forEach(function(d){
      var di = parseInt(d.getAttribute('data-i'),10);
      d.classList.toggle('active', di === i);
      d.classList.toggle('done', di < i);
    });
    window.scrollTo(0,0);
  }

  document.getElementById('btn-start').addEventListener('click', function(){ show(1); });

  var decoy = document.getElementById('btn-decoy');
  var card = document.querySelector('.card');
  var lastX = null, lastY = null;

  function moveDecoy(){
    var maxX = card.clientWidth - decoy.offsetWidth;
    var maxY = card.clientHeight - decoy.offsetHeight;
    var x, y;
    do {
      x = Math.max(0, Math.random() * maxX);
      y = Math.max(0, Math.random() * maxY);
    } while (lastX !== null && Math.abs(x - lastX) < maxX * 0.3 && Math.abs(y - lastY) < maxY * 0.3);
    lastX = x; lastY = y;
    decoy.style.left = x + 'px';
    decoy.style.top = y + 'px';
  }

  function placeDecoyInitial(){
    var cardRect = card.getBoundingClientRect();
    var primaryRect = document.getElementById('btn-start').getBoundingClientRect();
    var top = primaryRect.bottom - cardRect.top + 16;
    var left = primaryRect.left - cardRect.left;
    decoy.style.top = top + 'px';
    decoy.style.left = left + 'px';
  }

  decoy.addEventListener('pointerenter', moveDecoy);
  decoy.addEventListener('touchstart', function(e){ e.preventDefault(); moveDecoy(); }, {passive:false});
  decoy.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); moveDecoy(); });
  window.addEventListener('resize', function(){
    if(!document.getElementById('step-0').hidden) placeDecoyInitial();
  });

  document.querySelectorAll('[data-back]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var current = sections.findIndex(function(s){ return !s.hidden; });
      show(Math.max(0, current-1));
    });
  });

  var freeform = document.getElementById('freeform');
  document.querySelector('[data-next="1"]').addEventListener('click', function(){
    state.free = freeform.value.trim();
    show(2);
  });

  function wireChipGroup(containerId, set, nextBtn){
    var container = document.getElementById(containerId);
    container.querySelectorAll('.chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        var v = chip.getAttribute('data-value');
        if(set.has(v)){ set.delete(v); chip.classList.remove('selected'); }
        else { set.add(v); chip.classList.add('selected'); }
        if(nextBtn){ nextBtn.disabled = set.size === 0 && !document.getElementById('otro-comida').value.trim(); }
      });
    });
  }
  var next2 = document.getElementById('next-2');
  var otroComida = document.getElementById('otro-comida');
  wireChipGroup('chips-dulces', state.comida, next2);
  wireChipGroup('chips-salados', state.comida, next2);
  otroComida.addEventListener('input', function(){
    next2.disabled = state.comida.size === 0 && !otroComida.value.trim();
  });
  next2.addEventListener('click', function(){
    state.otroComida = otroComida.value.trim();
    show(3);
  });

  wireChipGroup('chips-pelis', state.pelis, null);
  var otroPeli = document.getElementById('otro-peli');
  document.querySelector('[data-next="3"]').addEventListener('click', function(){
    state.otroPeli = otroPeli.value.trim();
    show(4);
  });

  var DOW = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
  var MONTH_NAMES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var dowRow = document.getElementById('cal-dow');
  var daysRow = document.getElementById('cal-days');
  var monthSelect = document.getElementById('month-select');
  var next4 = document.getElementById('next-4');
  var timeCustom = document.getElementById('time-custom');

  var today = new Date();
  var todayY = today.getFullYear(), todayM = today.getMonth(), todayD = today.getDate();
  var selectedDayEl = null;
  var selectedTimeEl = null;

  DOW.forEach(function(label){
    var dow = document.createElement('div');
    dow.className = 'dow';
    dow.textContent = label;
    dowRow.appendChild(dow);
  });

  for(var m = todayM; m <= 11; m++){
    var opt = document.createElement('option');
    opt.value = m;
    opt.textContent = MONTH_NAMES[m] + ' ' + todayY;
    monthSelect.appendChild(opt);
  }

  function renderMonth(month){
    daysRow.innerHTML = '';
    var firstDow = new Date(todayY, month, 1).getDay();
    var daysInMonth = new Date(todayY, month + 1, 0).getDate();
    for(var i = 0; i < firstDow; i++){
      var empty = document.createElement('div');
      empty.className = 'day empty';
      daysRow.appendChild(empty);
    }
    for(var d = 1; d <= daysInMonth; d++){
      var btn = document.createElement('button');
      btn.className = 'day';
      btn.type = 'button';
      btn.textContent = d;
      var isPast = (month === todayM && d < todayD);
      if(isPast){ btn.disabled = true; }
      btn.setAttribute('data-y', todayY);
      btn.setAttribute('data-m', month);
      btn.setAttribute('data-d', d);
      btn.addEventListener('click', function(){
        if(selectedDayEl) selectedDayEl.classList.remove('selected');
        selectedDayEl = this;
        selectedDayEl.classList.add('selected');
        state.date = new Date(
          parseInt(this.getAttribute('data-y'),10),
          parseInt(this.getAttribute('data-m'),10),
          parseInt(this.getAttribute('data-d'),10)
        );
        next4.disabled = !(state.date && state.time);
      });
      daysRow.appendChild(btn);
    }
    selectedDayEl = null;
    state.date = null;
    next4.disabled = !(state.date && state.time);
  }

  monthSelect.addEventListener('change', function(){
    renderMonth(parseInt(monthSelect.value, 10));
  });
  renderMonth(todayM);

  document.querySelectorAll('#time-grid .time-pill').forEach(function(pill){
    pill.addEventListener('click', function(){
      if(selectedTimeEl) selectedTimeEl.classList.remove('selected');
      selectedTimeEl = this;
      selectedTimeEl.classList.add('selected');
      timeCustom.value = this.getAttribute('data-value');
      state.time = this.getAttribute('data-value');
      next4.disabled = !(state.date && state.time);
    });
  });

  timeCustom.addEventListener('input', function(){
    if(selectedTimeEl){ selectedTimeEl.classList.remove('selected'); selectedTimeEl = null; }
    state.time = timeCustom.value.trim();
    next4.disabled = !(state.date && state.time);
  });

  next4.addEventListener('click', function(){
    buildSummary();
    show(5);
  });

  function formatDate(dt){
    var days = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
    var months = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    return days[dt.getDay()] + ' ' + dt.getDate() + ' de ' + months[dt.getMonth()];
  }

  function buildSummary(){
    var comidaList = Array.from(state.comida);
    if(state.otroComida) comidaList.push(state.otroComida);
    var pelisList = Array.from(state.pelis);
    if(state.otroPeli) pelisList.push(state.otroPeli);

    document.getElementById('sum-date').textContent = state.date ? formatDate(state.date) : '—';
    document.getElementById('sum-time').textContent = state.time || '—';
    document.getElementById('sum-comida').textContent = comidaList.length ? comidaList.join(', ') : '—';
    document.getElementById('sum-pelis').textContent = pelisList.length ? pelisList.join(', ') : '—';
    document.getElementById('sum-free').textContent = state.free ? '"' + state.free + '"' : '—';
  }

  document.getElementById('btn-restart').addEventListener('click', function(){
    state.free=''; state.comida.clear(); state.pelis.clear();
    state.otroComida=''; state.otroPeli=''; state.date=null; state.time=null;
    freeform.value=''; otroComida.value=''; otroPeli.value=''; timeCustom.value='';
    document.querySelectorAll('.chip.selected').forEach(function(c){ c.classList.remove('selected'); });
    if(selectedTimeEl){ selectedTimeEl.classList.remove('selected'); selectedTimeEl=null; }
    monthSelect.value = todayM;
    renderMonth(todayM);
    next2.disabled = true; next4.disabled = true;
    show(0);
  });

  show(0);
  placeDecoyInitial();
})();
</script>
</body>
</html>
